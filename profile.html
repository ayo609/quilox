<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quilox - My Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Cormorant+Garamond:ital,wght@1,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root{--g:#1eb852;--gd:#159b42;--tx:#1a1a1a;--mu:#6b7280;--bd:#e5e7eb;--bg:#f8f9fb;--w:#fff;--sh:0 4px 15px rgba(0,0,0,.05);--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Manrope',sans-serif;border-radius:0}
body{background:var(--bg);color:var(--tx);padding-bottom:90px}

/* Header (square) */
.header-section{background:var(--g);padding:50px 20px 50px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(30,184,82,.2)}
.profile-avatar{background:var(--w);width:90px;height:90px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 15px rgba(0,0,0,.1);margin-bottom:15px;color:var(--g)}
.profile-avatar svg{width:45px;height:45px}
.header-section h2{color:#fff;font-size:20px;font-weight:800;margin-bottom:8px;font-family:'DM Mono',monospace;overflow-wrap:anywhere;text-align:center}
.status-badge{background:rgba(255,255,255,.2);color:#fff;padding:4px 12px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.3)}
.status-dot{width:6px;height:6px;background:#fff;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* Referral code card */
.user-card-section{padding:0 20px;margin-top:-20px;position:relative;z-index:3}
.user-card{background:var(--w);padding:20px;box-shadow:var(--sh);border:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:10px}
.code-info{min-width:0}
.code-info p{font-size:11px;color:var(--mu);font-weight:700;text-transform:uppercase;margin-bottom:5px}
.code-info h3{font-size:22px;font-family:'DM Mono',monospace;color:var(--g);letter-spacing:1px;overflow-wrap:anywhere}
.copy-code-btn{background:#ecfdf5;color:var(--g);border:none;padding:10px;font-weight:700;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.2s}
.copy-code-btn:active{background:var(--g);color:#fff}
.copy-code-btn svg{width:18px;height:18px}

/* Actions */
.action-section{padding:30px 20px;display:flex;flex-direction:column;gap:15px}
.action-btn{background:var(--w);padding:18px 20px;box-shadow:var(--sh);border:1px solid var(--bd);display:flex;align-items:center;gap:15px;width:100%;text-align:left;cursor:pointer;transition:.2s;text-decoration:none;color:var(--tx)}
.action-btn:active{border-color:var(--g)}
.btn-icon{background:#ecfdf5;color:var(--g);width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-icon svg{width:22px;height:22px}
.btn-text{flex:1}
.btn-text h4{font-size:15px;font-weight:700;margin-bottom:2px}
.btn-text p{font-size:12px;color:var(--mu)}
.btn-arrow{color:var(--mu)}
.logout-btn{background:#fef2f2;padding:18px 20px;border:1px solid #fecaca;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;cursor:pointer;color:var(--red);font-weight:700;font-size:15px;margin-top:10px}
.logout-btn:active{background:#fee2e2}
.logout-btn svg{width:20px;height:20px}

/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:var(--w);display:flex;justify-content:space-around;padding:10px 0 15px;box-shadow:0 -2px 15px rgba(0,0,0,.05);border-top:1px solid var(--bd);z-index:1000}
.nav-item{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--mu);font-size:11px;font-weight:700}
.nav-item.active{color:var(--g)}
.nav-item svg{width:22px;height:22px;margin-bottom:4px}

/* SweetAlert */
.swal2-container{z-index:99999!important}
.swal2-popup{border-radius:0!important;max-width:calc(100vw - 32px)!important;font-family:'Manrope',sans-serif!important}
.swal2-popup:not(.swal-custom){width:320px!important;padding:20px 16px 16px!important}
.swal2-popup:not(.swal-custom) .swal2-title{font-size:19px;font-weight:800}
.swal2-popup:not(.swal-custom) .swal2-html-container{font-size:14px;line-height:1.6;margin:8px 0 0}
.swal2-styled{border-radius:0!important;font-size:14px!important;font-weight:700!important}
.swal2-input{border-radius:0!important;width:100%!important;margin:6px 0!important;font-size:14px!important;height:44px!important}
.swal2-validation-message{border-radius:0!important;font-size:12px!important}
.swal2-close{box-shadow:none!important}
/* Small toast */
.swal2-container.swal2-top-start{top:10px!important;left:10px!important;right:auto!important;bottom:auto!important;padding:0!important;width:auto!important;max-width:calc(100vw - 20px)!important}
.swal2-popup.swal-custom{width:auto!important;max-width:min(300px,calc(100vw - 20px))!important;padding:8px 12px!important;margin:0!important;border-left:4px solid var(--g)!important;box-shadow:0 4px 12px rgba(0,0,0,.15)!important;display:flex!important;align-items:center!important;grid-template-columns:none!important}
.swal-custom.swal2-icon-error{border-left-color:var(--red)!important}
.swal-custom .swal2-title{font-size:13px!important;line-height:1.3!important;font-weight:700!important;margin:0!important;padding:0!important;text-align:left!important}
.swal-custom .swal2-icon{margin:0 10px 0 0!important;width:22px!important;min-width:22px!important;height:22px!important;border-width:2px!important;transform:scale(.85)}
.swal-custom .swal2-timer-progress-bar{background:var(--g)!important}
</style>
</head>
<body>

<header class="header-section">
  <div class="profile-avatar"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></div>
  <h2 id="userPhone">Loading...</h2>
  <div class="status-badge"><div class="status-dot"></div>Active Account</div>
</header>

<section class="user-card-section">
  <div class="user-card">
    <div class="code-info"><p>Your Referral Code</p><h3 id="userRefCode">---</h3></div>
    <button class="copy-code-btn" onclick="copyCode()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>Copy
    </button>
  </div>
</section>

<section class="action-section">
  <button class="action-btn" onclick="openChangePassword()">
    <div class="btn-icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg></div>
    <div class="btn-text"><h4>Change Password</h4><p>Update your account password</p></div>
    <div class="btn-arrow"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></div>
  </button>

  <!-- UPDATED: WhatsApp Support -->
  <a href="https://wa.me/2348085439040" target="_blank" rel="noopener" class="action-btn">
    <div class="btn-icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"/></svg></div>
    <div class="btn-text"><h4>Contact Support</h4><p>Chat with us on WhatsApp</p></div>
    <div class="btn-arrow"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></div>
  </a>

  <button class="logout-btn" onclick="logout()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>Logout
  </button>
</section>

<nav class="bottom-nav">
  <a href="dashboard.html" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Home</a>
  <a href="referral.html" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>Referral</a>
  <a href="profile.html" class="nav-item active"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>Profile</a>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, updatePassword, EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCuedBfRowmtHYUuzAB4a9RuOmaON5M0VE",
  authDomain: "quilox-59463.firebaseapp.com",
  projectId: "quilox-59463",
  storageBucket: "quilox-59463.firebasestorage.app",
  messagingSenderId: "602079101577",
  appId: "1:602079101577:web:f4044eca59b7ed8d38fc58"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
let myCode = '';

const Toast = Swal.mixin({ toast: true, position: 'top-start', showConfirmButton: false, timer: 3500, timerProgressBar: true, width: 'auto', customClass: { popup: 'swal-custom' } });

onAuthStateChanged(auth, async user => {
  if (!user) return (window.location.href = 'login.html');
  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (snap.exists()) {
      const d = snap.data();
      $('userPhone').innerText = d.phone;
      $('userRefCode').innerText = d.referralCode;
      myCode = d.referralCode;
    }
  } catch (e) { console.error(e); Toast.fire({ icon: 'error', title: 'Could not load your profile' }); }
});

window.copyCode = async () => {
  if (!myCode) return;
  try { await navigator.clipboard.writeText(myCode); }
  catch {
    const t = document.createElement('input'); t.value = myCode; document.body.appendChild(t);
    t.select(); document.execCommand('copy'); t.remove();
  }
  Toast.fire({ icon: 'success', title: 'Code copied!' });
};

// Change password: verifies the current password first
window.openChangePassword = async () => {
  const res = await Swal.fire({
    title: 'Change Password',
    html: `<input type="password" id="curPass" class="swal2-input" placeholder="Current password" autocomplete="current-password">
           <input type="password" id="newPass" class="swal2-input" placeholder="New password (min 6 characters)" autocomplete="new-password">
           <input type="password" id="confPass" class="swal2-input" placeholder="Confirm new password" autocomplete="new-password">`,
    showCloseButton: true, showCancelButton: true, confirmButtonText: 'Update', cancelButtonText: 'Cancel',
    confirmButtonColor: '#1eb852', cancelButtonColor: '#6b7280', reverseButtons: true,
    showLoaderOnConfirm: true, allowOutsideClick: () => !Swal.isLoading(),
    preConfirm: async () => {
      const cur = $('curPass').value, np = $('newPass').value, cp = $('confPass').value;
      if (!cur || !np || !cp) return Swal.showValidationMessage('Please fill in all fields'), false;
      if (np.length < 6) return Swal.showValidationMessage('New password must be at least 6 characters'), false;
      if (np !== cp) return Swal.showValidationMessage('New passwords do not match'), false;
      if (np === cur) return Swal.showValidationMessage('New password must be different from the current one'), false;
      try {
        const u = auth.currentUser;
        await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, cur));
        await updatePassword(u, np);
        return true;
      } catch (e) {
        console.error(e);
        const bad = ['auth/wrong-password', 'auth/invalid-credential', 'auth/invalid-login-credentials'].includes(e.code);
        Swal.showValidationMessage(bad ? 'Current password is incorrect' : e.code === 'auth/too-many-requests' ? 'Too many attempts. Try again later' : 'Could not update password. Try again');
        return false;
      }
    }
  });
  if (res.isConfirmed) Toast.fire({ icon: 'success', title: 'Password updated successfully!' });
};

window.logout = async () => {
  const res = await Swal.fire({
    icon: 'warning', title: 'Log Out?', text: 'Are you sure you want to log out?',
    showCloseButton: true, showCancelButton: true, confirmButtonText: 'Yes, Logout', cancelButtonText: 'Cancel',
    confirmButtonColor: '#ef4444', cancelButtonColor: '#6b7280', reverseButtons: true
  });
  if (res.isConfirmed) signOut(auth).then(() => (window.location.href = 'login.html'));
};
</script>
</body>
</html>
