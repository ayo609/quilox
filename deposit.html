<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quilox - Deposit Funds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root{--g:#1eb852;--gd:#159b42;--tx:#1a1a1a;--mu:#6b7280;--bd:#e5e7eb;--bg:#f8f9fb;--w:#fff;--sh:0 4px 15px rgba(0,0,0,.05);--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Manrope',sans-serif;border-radius:0}
body{background:var(--bg);color:var(--tx);padding-bottom:90px}

.top-header{background:var(--g);padding:20px;color:#fff;display:flex;align-items:center;gap:15px;box-shadow:0 4px 10px rgba(30,184,82,.2)}
.back-btn{background:rgba(255,255,255,.2);border:none;color:#fff;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
.top-header h1{font-size:18px;font-weight:700}

.rules-banner{background:#ecfdf5;border:1px solid var(--g);padding:15px;margin:20px;font-size:12px;color:#065f46;line-height:1.6;text-align:center;font-weight:600}

.currency-toggle{padding:0 20px;display:flex;gap:10px;margin-bottom:20px}
.currency-btn{flex:1;padding:12px 6px;border:1px solid var(--bd);background:var(--w);font-weight:700;font-size:13px;cursor:pointer;transition:.2s;color:var(--mu)}
.currency-btn.active{background:var(--g);color:#fff;border-color:var(--g)}

.payment-box{background:var(--w);margin:0 20px 20px;padding:20px;box-shadow:var(--sh);border:1px dashed var(--g)}
.payment-box h3{font-size:16px;margin-bottom:15px;border-bottom:1px solid var(--bd);padding-bottom:10px}
.pay-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-size:14px}
.pay-row span{color:var(--mu)}
.pay-row strong{font-family:'DM Mono',monospace;font-size:15px;text-align:right}
.addr-box{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#f3f4f6;padding:10px;margin-top:5px}
.addr-box strong{font-size:11px;word-break:break-all;text-align:left}
.copy-btn-small{background:var(--g);color:#fff;border:none;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;margin-left:8px}
.addr-box .copy-btn-small{margin-left:0}
.warn{font-size:11px;color:var(--red);margin-top:10px;line-height:1.5}

.form-section{padding:0 20px;margin-bottom:30px}
.form-card{background:var(--w);padding:20px;box-shadow:var(--sh)}
.form-card h3{font-size:15px;margin-bottom:15px}
.input-group{margin-bottom:15px}
.input-group label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin-bottom:5px}
.input-group input{width:100%;padding:12px;border:1px solid var(--bd);font-size:14px;outline:none;transition:.2s;background:var(--w)}
.input-group input:focus{border-color:var(--g)}
.input-group input[type=file]{padding:8px;background:var(--bg)}
.btn-submit{width:100%;background:var(--g);color:#fff;border:none;padding:15px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;margin-top:10px}
.btn-submit:active{background:var(--gd)}

.history-section{padding:0 20px}
.section-title{font-size:15px;font-weight:800;margin-bottom:15px}
.history-card{background:var(--w);padding:15px;box-shadow:var(--sh);margin-bottom:10px}
.hist-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed var(--bd);padding-bottom:10px;margin-bottom:10px}
.hist-amount{font-family:'DM Mono',monospace;font-weight:800;font-size:16px}
.hist-status{font-size:11px;font-weight:700;padding:3px 8px}
.status-pending{background:#fef3c7;color:#d97706}.status-approved{background:#ecfdf5;color:var(--g)}.status-rejected{background:#fef2f2;color:var(--red)}
.hist-details{font-size:12px;color:var(--mu);line-height:1.6}
.loader{display:flex;justify-content:center;padding:20px;color:var(--mu);font-size:13px}

.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:var(--w);display:flex;justify-content:space-around;padding:10px 0 15px;box-shadow:0 -2px 15px rgba(0,0,0,.05);border-top:1px solid var(--bd);z-index:1000}
.nav-item{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--mu);font-size:11px;font-weight:700}
.nav-item.active{color:var(--g)}
.nav-item svg{width:22px;height:22px;margin-bottom:4px}

/* SweetAlert: standard popups, square and phone-sized */
.swal2-container{z-index:99999!important}
.swal2-popup{border-radius:0!important;max-width:calc(100vw - 32px)!important;font-family:'Manrope',sans-serif!important}
.swal2-popup:not(.swal-custom){width:320px!important;padding:20px 16px 16px!important}
.swal2-popup:not(.swal-custom) .swal2-title{font-size:19px;font-weight:800}
.swal2-popup:not(.swal-custom) .swal2-html-container{font-size:14px;line-height:1.7;margin:8px 0 0}
.swal2-styled{border-radius:0!important;font-size:14px!important;font-weight:700!important}
.swal2-validation-message{border-radius:0!important;font-size:12px!important}
.swal2-close{box-shadow:none!important}
.swal2-container.swal2-top-start{top:10px!important;left:10px!important;right:auto!important;bottom:auto!important;padding:0!important;width:auto!important;max-width:calc(100vw - 20px)!important}
.swal2-popup.swal-custom{width:auto!important;max-width:min(300px,calc(100vw - 20px))!important;padding:8px 12px!important;margin:0!important;border-left:4px solid var(--g)!important;box-shadow:0 4px 12px rgba(0,0,0,.15)!important;display:flex!important;align-items:center!important;grid-template-columns:none!important}
.swal-custom.swal2-icon-error{border-left-color:var(--red)!important}
.swal-custom .swal2-title{font-size:13px!important;line-height:1.3!important;font-weight:700!important;margin:0!important;padding:0!important;text-align:left!important}
.swal-custom .swal2-icon{margin:0 10px 0 0!important;width:22px!important;min-width:22px!important;height:22px!important;border-width:2px!important;transform:scale(.85)}
.swal-custom .swal2-timer-progress-bar{background:var(--g)!important}
</style>
</head>
<body>

<header class="top-header">
  <a href="dashboard.html" class="back-btn"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg></a>
  <h1>Deposit Funds</h1>
</header>

<div class="rules-banner">
  📥 Minimum Deposit: $5 (₦7,500)<br>
  Please send the exact amount. Manual approval takes 0-5 minutes.
</div>

<section class="currency-toggle">
  <button class="currency-btn active" id="btnNGN" onclick="switchDepositCurrency('NGN')">Deposit via Bank (NGN)</button>
  <button class="currency-btn" id="btnUSD" onclick="switchDepositCurrency('USD')">Deposit via USDT (USD)</button>
</section>

<section class="payment-box" id="paymentDetailsBox"></section>
<section class="form-section"><div class="form-card" id="depositFormCard"></div></section>

<section class="history-section">
  <div class="section-title">Deposit History</div>
  <div id="historyContainer"><div class="loader">Loading history...</div></div>
</section>

<nav class="bottom-nav">
  <a href="dashboard.html" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Home</a>
  <a href="referral.html" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>Referral</a>
  <a href="profile.html" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>Profile</a>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, addDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCuedBfRowmtHYUuzAB4a9RuOmaON5M0VE",
  authDomain: "quilox-59463.firebaseapp.com",
  projectId: "quilox-59463",
  storageBucket: "quilox-59463.firebasestorage.app",
  messagingSenderId: "602079101577",
  appId: "1:602079101577:web:f4044eca59b7ed8d38fc58"
});
const auth = getAuth(app), db = getFirestore(app);

// ---- Payment details (edit these) ----
const BANK_DETAILS = { accountName: "David Lucky", accountNumber: "9135919690", bankName: "PalmPay" };
const USDT_ADDRESS = "0x30EBa25fBF408085f9FCF63d4562fB893AC21719";   // <- put your real 0x... BEP20 address
const USDT_NETWORK = "BEP20 (BSC)";
const MIN = { USD: 5, NGN: 7500 };

const USDT_READY = /^0x[a-fA-F0-9]{40}$/.test(USDT_ADDRESS);
const $ = id => document.getElementById(id);
const fmt = (n, c) => (c === 'NGN' ? '₦' : '$') + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
let me = null, userData = {}, cur = 'NGN', busy = false;

const Toast = Swal.mixin({ toast: true, position: 'top-start', showConfirmButton: false, timer: 3500, timerProgressBar: true, width: 'auto', customClass: { popup: 'swal-custom' } });

onAuthStateChanged(auth, async user => {
  if (!user) return (window.location.href = 'login.html');
  me = user;
  const q = new URLSearchParams(location.search).get('currency');
  if (q === 'USD' || q === 'NGN') cur = q;
  try { const s = await getDoc(doc(db, 'users', user.uid)); if (s.exists()) userData = s.data(); }
  catch (e) { console.error(e); Toast.fire({ icon: 'error', title: 'Could not load your account' }); }
  switchDepositCurrency(cur);
  loadHistory();
});

window.switchDepositCurrency = c => {
  cur = c;
  $('btnNGN').classList.toggle('active', c === 'NGN');
  $('btnUSD').classList.toggle('active', c === 'USD');
  render();
};

function render() {
  const pay = $('paymentDetailsBox'), form = $('depositFormCard');
  if (cur === 'NGN') {
    pay.innerHTML = `<h3>Bank Transfer Details (NGN)</h3>
      <div class="pay-row"><span>Account Name</span><strong>${BANK_DETAILS.accountName}</strong></div>
      <div class="pay-row"><span>Account Number</span><div><strong>${BANK_DETAILS.accountNumber}</strong><button class="copy-btn-small" onclick="copyText('${BANK_DETAILS.accountNumber}')">Copy</button></div></div>
      <div class="pay-row"><span>Bank</span><strong>${BANK_DETAILS.bankName}</strong></div>
      <p class="warn">Transfer exactly the amount you wish to deposit, then fill the form below.</p>`;
    form.innerHTML = `<h3>Submit Deposit Proof</h3>
      <div class="input-group"><label>Amount Deposited (₦)</label><input type="number" inputmode="decimal" id="depositAmount" placeholder="e.g. 7500"></div>
      <div class="input-group"><label>Sender Full Name</label><input type="text" id="senderName" placeholder="Name on the bank transfer"></div>
      <div class="input-group"><label>Upload Payment Receipt</label><input type="file" id="receiptFile" accept="image/*"></div>
      <button class="btn-submit" onclick="submitDeposit()">Submit for Approval</button>`;
  } else if (!USDT_READY) {
    pay.innerHTML = `<h3>USDT Deposit (USD)</h3><p class="warn" style="font-size:13px">USDT deposits are not available right now. Please deposit via bank transfer (NGN). Your naira balance can be used to buy any plan.</p>`;
    form.innerHTML = '';
  } else {
    pay.innerHTML = `<h3>USDT Deposit Details (USD)</h3>
      <div class="pay-row"><span>Network</span><strong style="color:#2563eb">${USDT_NETWORK}</strong></div>
      <div class="pay-row" style="flex-direction:column;align-items:stretch"><span>Wallet Address</span>
        <div class="addr-box"><strong>${USDT_ADDRESS}</strong><button class="copy-btn-small" onclick="copyText('${USDT_ADDRESS}')">Copy</button></div></div>
      <p class="warn">⚠️ Only send USDT via BEP20 network. Other networks will be lost.</p>`;
    form.innerHTML = `<h3>Submit Deposit Proof</h3>
      <div class="input-group"><label>Amount Deposited ($)</label><input type="number" inputmode="decimal" id="depositAmount" placeholder="e.g. 5"></div>
      <div class="input-group"><label>Sender Wallet Address</label><input type="text" id="senderAddress" placeholder="Your USDT/BEP20 address" autocomplete="off"></div>
      <div class="input-group"><label>Transaction ID / Hash</label><input type="text" id="txHash" placeholder="Transaction Hash from BscScan" autocomplete="off"></div>
      <div class="input-group"><label>Upload Payment Receipt</label><input type="file" id="receiptFile" accept="image/*"></div>
      <button class="btn-submit" onclick="submitDeposit()">Submit for Approval</button>`;
  }
}

window.copyText = async text => {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = document.createElement('input'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  Toast.fire({ icon: 'success', title: 'Copied!' });
};

// Shrink the receipt photo so it fits comfortably inside a Firestore document
function toJpeg(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width), c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function compressReceipt(file) {
  let w = 800, q = 0.6;
  for (let i = 0; i < 4; i++) {
    const out = await toJpeg(file, w, q);
    if (out.length < 700000) return out;
    w = Math.round(w * 0.8); q = Math.max(0.4, q - 0.1);
  }
  throw new Error('TOO_LARGE');
}

window.submitDeposit = async () => {
  if (busy) return;
  const amount = Math.round(parseFloat($('depositAmount').value) * 100) / 100;
  if (isNaN(amount) || amount < MIN[cur]) return Toast.fire({ icon: 'error', title: `Minimum deposit is ${fmt(MIN[cur], cur).replace(/\.00$/, '')}` });

  let proof;
  if (cur === 'NGN') {
    const senderName = $('senderName').value.trim();
    if (!senderName) return Toast.fire({ icon: 'error', title: 'Enter sender full name' });
    proof = { senderName };
  } else {
    const senderAddress = $('senderAddress').value.trim(), txHash = $('txHash').value.trim();
    if (!senderAddress || !txHash) return Toast.fire({ icon: 'error', title: 'Fill sender address and transaction hash' });
    proof = { senderAddress, txHash };
  }
  const file = $('receiptFile').files[0];
  if (!file) return Toast.fire({ icon: 'error', title: 'Please upload your payment receipt' });
  if (!file.type.startsWith('image/')) return Toast.fire({ icon: 'error', title: 'Receipt must be an image' });

  busy = true;
  try {
    const res = await Swal.fire({
      icon: 'question', title: 'Submit Deposit?',
      html: `Amount: <b>${fmt(amount, cur)}</b><br>Method: <b>${cur === 'USD' ? 'USDT (BEP20)' : 'Bank Transfer'}</b><br>Approval takes 0-5 minutes.`,
      showCloseButton: true, showCancelButton: true, confirmButtonText: 'Submit', cancelButtonText: 'Cancel',
      confirmButtonColor: '#1eb852', cancelButtonColor: '#6b7280', reverseButtons: true,
      showLoaderOnConfirm: true, allowOutsideClick: () => !Swal.isLoading(),
      preConfirm: async () => {
        try {
          const receiptBase64 = await compressReceipt(file);
          await addDoc(collection(db, 'deposits'), {
            userId: me.uid, phone: userData.phone, amount, currency: cur,
            paymentProof: proof, receiptBase64, status: 'pending', createdAt: serverTimestamp()
          });
          return true;
        } catch (e) {
          console.error(e);
          Swal.showValidationMessage(e.message === 'TOO_LARGE' ? 'Receipt image is too large. Use a smaller screenshot.' : 'Failed to submit deposit. Please try again.');
          return false;
        }
      }
    });
    if (!res.isConfirmed) return;
    await Swal.fire({ icon: 'success', title: 'Deposit Submitted!', text: 'Your deposit will be approved in 0-5 minutes.', timer: 2500, showConfirmButton: false, showCloseButton: true });
    render();
  } finally { busy = false; }
};

function loadHistory() {
  const box = $('historyContainer');
  onSnapshot(query(collection(db, 'deposits'), where('userId', '==', me.uid)), snap => {
    if (snap.empty) return (box.innerHTML = '<div class="loader">No deposit history yet.</div>');
    const ms = d => d.createdAt?.toMillis?.() || Date.now();
    box.innerHTML = snap.docs.map(d => d.data()).sort((a, b) => ms(b) - ms(a)).map(d => {
      const st = d.status === 'approved' ? ['status-approved', 'Approved'] : d.status === 'rejected' ? ['status-rejected', 'Rejected'] : ['status-pending', 'Pending'];
      return `<div class="history-card">
        <div class="hist-header"><div class="hist-amount">${fmt(d.amount, d.currency)}</div><div class="hist-status ${st[0]}">${st[1]}</div></div>
        <div class="hist-details"><div>Method: ${d.currency === 'USD' ? 'USDT (BEP20)' : 'Bank Transfer'}</div>
        <div>Date: ${d.createdAt?.toDate ? d.createdAt.toDate().toLocaleString() : 'Processing...'}</div></div></div>`;
    }).join('');
  }, e => console.error(e));
}
</script>
</body>
</html>
