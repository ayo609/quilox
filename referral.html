<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quilox - Referral Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Cormorant+Garamond:ital,wght@1,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root{--g:#1eb852;--gd:#159b42;--tx:#1a1a1a;--mu:#6b7280;--bd:#e5e7eb;--bg:#f8f9fb;--w:#fff;--sh:0 4px 15px rgba(0,0,0,.05);--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Manrope',sans-serif;border-radius:0}
body{background:var(--bg);color:var(--tx);padding-bottom:90px}

.top-header{background:var(--g);padding:20px;color:#fff;display:flex;align-items:center;gap:15px;box-shadow:0 4px 10px rgba(30,184,82,.2)}
.back-btn{background:rgba(255,255,255,.2);border:none;color:#fff;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
.top-header h1{font-size:18px;font-weight:700}

.referral-link-section{padding:20px}
.link-card{background:var(--w);padding:20px;box-shadow:var(--sh);border:1px solid var(--bd);text-align:center}
.code-display-box{background:#ecfdf5;border:2px dashed var(--g);padding:15px;margin-bottom:20px}
.code-display-box p{font-size:12px;color:var(--g);font-weight:700;text-transform:uppercase;margin-bottom:5px}
.code-display-box h2{font-size:24px;font-family:'DM Mono',monospace;letter-spacing:2px;overflow-wrap:anywhere}
.link-card h3{font-size:14px;color:var(--mu);margin-bottom:10px}
.link-input-group{display:flex;background:var(--bg);padding:5px;border:1px solid var(--bd);margin-bottom:15px}
.link-input-group input{flex:1;min-width:0;border:none;background:transparent;padding:10px;font-size:13px;font-family:'DM Mono',monospace;color:var(--tx);outline:none}
.copy-btn{background:var(--g);color:#fff;border:none;padding:10px 15px;font-weight:700;font-size:12px;cursor:pointer}
.share-btn{width:100%;background:var(--tx);color:#fff;border:none;padding:14px;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}

.stats-section{padding:0 20px;display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:20px}
.stat-card{background:var(--w);padding:15px;box-shadow:var(--sh);text-align:center;border-top:3px solid var(--g);min-width:0}
.stat-value{font-size:20px;font-weight:800;font-family:'DM Mono',monospace;margin-bottom:5px;overflow-wrap:anywhere}
.stat-value.sm{font-size:13px;line-height:1.5}
.stat-label{font-size:11px;color:var(--mu);font-weight:700;text-transform:uppercase}

.commission-info{padding:0 20px;margin-bottom:20px}
.commission-card{background:var(--w);padding:20px;box-shadow:var(--sh)}
.commission-title{font-size:15px;font-weight:800;margin-bottom:15px;text-align:center}
.commission-note{font-size:11px;color:var(--mu);text-align:center;margin-top:12px}
.levels-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.level-box{background:#ecfdf5;padding:10px;text-align:center;border:1px solid var(--g)}
.level-title{font-size:11px;color:var(--mu);font-weight:700;margin-bottom:5px}
.level-percent{font-size:18px;font-weight:800;color:var(--g);font-family:'DM Mono',monospace}

.downlines-section{padding:0 20px}
.section-title{font-size:15px;font-weight:800;margin-bottom:15px;padding-left:5px}
.downline-item{background:var(--w);padding:15px;box-shadow:var(--sh);margin-bottom:10px;border-left:4px solid var(--g)}
.downline-item.l2{border-left-color:#2563eb}.downline-item.l3{border-left-color:#f59e0b}
.downline-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px dashed var(--bd);padding-bottom:10px}
.downline-info h4{font-size:14px;font-weight:700}
.downline-info p{font-size:11px;color:var(--mu);font-family:'DM Mono',monospace;margin-top:3px}
.downline-level{font-size:10px;font-weight:700;padding:4px 8px}
.l1-badge{background:#ecfdf5;color:var(--g)}.l2-badge{background:#eff6ff;color:#2563eb}.l3-badge{background:#fffbeb;color:#f59e0b}
.downline-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.d-stat span{display:block;font-size:10px;color:var(--mu);text-transform:uppercase;font-weight:700}
.d-stat strong{font-size:13px;font-family:'DM Mono',monospace;overflow-wrap:anywhere}
.d-stat strong.earned{color:var(--g)}
.loader{display:flex;justify-content:center;text-align:center;padding:20px;color:var(--mu);font-size:13px}

.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:var(--w);display:flex;justify-content:space-around;padding:10px 0 15px;box-shadow:0 -2px 15px rgba(0,0,0,.05);border-top:1px solid var(--bd);z-index:1000}
.nav-item{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--mu);font-size:11px;font-weight:700}
.nav-item.active{color:var(--g)}
.nav-item svg{width:22px;height:22px;margin-bottom:4px}

/* SweetAlert: small square toast, top-left */
.swal2-container{z-index:99999!important}
.swal2-container.swal2-top-start{top:10px!important;left:10px!important;right:auto!important;bottom:auto!important;padding:0!important;width:auto!important;max-width:calc(100vw - 20px)!important}
.swal2-popup.swal-custom{width:auto!important;max-width:min(300px,calc(100vw - 20px))!important;padding:8px 12px!important;margin:0!important;border-radius:0!important;border-left:4px solid var(--g)!important;box-shadow:0 4px 12px rgba(0,0,0,.15)!important;display:flex!important;align-items:center!important;grid-template-columns:none!important}
.swal-custom.swal2-icon-error{border-left-color:var(--red)!important}
.swal-custom .swal2-title{font-size:13px!important;line-height:1.3!important;font-weight:700!important;margin:0!important;padding:0!important;text-align:left!important}
.swal-custom .swal2-icon{margin:0 10px 0 0!important;width:22px!important;min-width:22px!important;height:22px!important;border-width:2px!important;transform:scale(.85)}
.swal-custom .swal2-timer-progress-bar{background:var(--g)!important}
</style>
</head>
<body>

<header class="top-header">
  <a href="dashboard.html" class="back-btn"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg></a>
  <h1>Referral Program</h1>
</header>

<section class="referral-link-section">
  <div class="link-card">
    <div class="code-display-box"><p>Your Referral Code</p><h2 id="refCodeDisplay">Loading...</h2></div>
    <h3>Your Unique Referral Link</h3>
    <div class="link-input-group">
      <input type="text" id="referralLink" readonly value="Loading...">
      <button class="copy-btn" onclick="copyLink()">Copy</button>
    </div>
    <button class="share-btn" onclick="shareLink()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
      Share Link
    </button>
  </div>
</section>

<section class="stats-section">
  <div class="stat-card"><div class="stat-value" id="totalReferrals">0</div><div class="stat-label">Total Referrals</div></div>
  <div class="stat-card"><div class="stat-value sm" id="totalEarned">$0.00 / ₦0.00</div><div class="stat-label">Referral Earnings</div></div>
</section>

<section class="commission-info">
  <div class="commission-card">
    <div class="commission-title">Commission Structure</div>
    <div class="levels-grid">
      <div class="level-box"><div class="level-title">Level 1</div><div class="level-percent">10%</div></div>
      <div class="level-box"><div class="level-title">Level 2</div><div class="level-percent">3%</div></div>
      <div class="level-box"><div class="level-title">Level 3</div><div class="level-percent">1%</div></div>
    </div>
    <p class="commission-note">Paid once, when a referral buys their first plan.</p>
  </div>
</section>

<section class="downlines-section">
  <div class="section-title">My Downlines</div>
  <div id="downlinesContainer"><div class="loader">Loading referrals...</div></div>
</section>

<nav class="bottom-nav">
  <a href="dashboard.html" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Home</a>
  <a href="referral.html" class="nav-item active"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>Referral</a>
  <a href="profile.html" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>Profile</a>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCuedBfRowmtHYUuzAB4a9RuOmaON5M0VE",
  authDomain: "quilox-59463.firebaseapp.com",
  projectId: "quilox-59463",
  storageBucket: "quilox-59463.firebasestorage.app",
  messagingSenderId: "602079101577",
  appId: "1:602079101577:web:f4044eca59b7ed8d38fc58"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const r2 = n => Math.round(n * 100) / 100;
const fmt = (n, c) => (c === 'NGN' ? '₦' : '$') + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

// Each user stores their upline at 3 levels, so every level is one simple query (no 10-user limit)
const LEVELS = [['referredBy', .10], ['referredByL2', .03], ['referredByL3', .01]];
let myCode = '';

const Toast = Swal.mixin({ toast: true, position: 'top-start', showConfirmButton: false, timer: 3000, timerProgressBar: true, width: 'auto', customClass: { popup: 'swal-custom' } });

onAuthStateChanged(auth, async user => {
  if (!user) return (window.location.href = 'login.html');
  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (!snap.exists()) return;
    myCode = snap.data().referralCode;
    $('refCodeDisplay').innerText = myCode;
    const base = window.location.origin + window.location.pathname.replace('referral.html', 'index.html');
    $('referralLink').value = `${base}?ref=${myCode}`;
    await loadDownlines(user.uid);
  } catch (e) {
    console.error(e);
    $('downlinesContainer').innerHTML = '<div class="loader">Could not load referrals. Please refresh.</div>';
    Toast.fire({ icon: 'error', title: 'Could not load referrals' });
  }
});

async function loadDownlines(uid) {
  const box = $('downlinesContainer');
  const snaps = await Promise.all(LEVELS.map(([f]) => getDocs(query(collection(db, 'users'), where(f, '==', uid)))));
  const ms = x => x.createdAt?.toMillis?.() || 0;
  const all = [];
  snaps.forEach((s, i) => s.docs.forEach(d => all.push({ u: d.data(), level: i + 1, pct: LEVELS[i][1] })));
  all.sort((a, b) => a.level - b.level || ms(b.u) - ms(a.u));

  $('totalReferrals').innerText = all.length;
  if (!all.length) {
    $('totalEarned').innerText = `${fmt(0, 'USD')} / ${fmt(0, 'NGN')}`;
    return (box.innerHTML = '<div class="loader">No referrals yet. Share your link to start earning!</div>');
  }

  // Earnings = what each downline's first purchase paid you (matches the dashboard credit)
  const sums = { USD: 0, NGN: 0 };
  box.innerHTML = all.map(({ u, level, pct }) => {
    let plan = 'No purchase yet', earned = fmt(0, 'USD');
    if (u.hasInvested && u.firstPlanAmount) {
      const cur = u.firstPlanCurrency === 'NGN' ? 'NGN' : 'USD', bonus = r2(u.firstPlanAmount * pct);
      sums[cur] += bonus;
      plan = `${u.firstPlanName} (${fmt(u.firstPlanAmount, cur)})`;
      earned = fmt(bonus, cur);
    } else if (u.hasInvested) { plan = 'Purchased'; earned = '—'; }
    return `<div class="downline-item${level > 1 ? ' l' + level : ''}">
      <div class="downline-header">
        <div class="downline-info"><h4>${u.phone || 'User'}</h4><p>Joined: ${u.createdAt?.toDate ? u.createdAt.toDate().toLocaleDateString() : 'N/A'}</p></div>
        <div class="downline-level l${level}-badge">Level ${level}</div>
      </div>
      <div class="downline-stats">
        <div class="d-stat"><span>Plan Purchased</span><strong>${plan}</strong></div>
        <div class="d-stat"><span>Bonus Earned</span><strong class="earned">${earned}</strong></div>
      </div></div>`;
  }).join('');
  $('totalEarned').innerText = `${fmt(sums.USD, 'USD')} / ${fmt(sums.NGN, 'NGN')}`;
}

window.copyLink = async () => {
  const el = $('referralLink');
  try { await navigator.clipboard.writeText(el.value); }
  catch { el.select(); el.setSelectionRange(0, 99999); document.execCommand('copy'); }
  Toast.fire({ icon: 'success', title: 'Link copied!' });
};

window.shareLink = () => {
  const url = $('referralLink').value;
  if (navigator.share) {
    navigator.share({ title: 'Join Quilox', text: `Grow your money every day with Quilox. Use my code: ${myCode} or sign up with my link!`, url }).catch(() => {});
  } else window.copyLink();
};
</script>
</body>
</html>
