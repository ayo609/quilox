<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quilox Admin - Deposit Approvals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root{--g:#1eb852;--gd:#159b42;--tx:#1a1a1a;--mu:#6b7280;--bd:#e5e7eb;--bg:#f1f5f9;--w:#fff;--sh:0 4px 15px rgba(0,0,0,.05);--red:#ef4444;--amber:#f59e0b;--navy:#0f172a}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Manrope',sans-serif;border-radius:0}
body{background:var(--bg);color:var(--tx);padding-bottom:90px}

.top-header{background:var(--navy);padding:20px;color:#fff;display:flex;align-items:center;gap:15px;border-bottom:4px solid var(--g)}
.back-btn{background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.top-header h1{font-size:18px;font-weight:700}

.tabs-container{padding:20px}
.tabs-header{display:flex;background:var(--w);padding:5px;box-shadow:var(--sh);margin-bottom:15px}
.tab-btn{flex:1;padding:12px 5px;font-size:13px;font-weight:700;color:var(--mu);background:transparent;border:none;cursor:pointer;transition:.3s;display:flex;align-items:center;justify-content:center;gap:8px}
.tab-btn.active{background:var(--g);color:#fff;box-shadow:0 2px 8px rgba(30,184,82,.3)}
.cnt{background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;padding:0 5px;display:none;align-items:center;justify-content:center}
.search-box{display:flex;background:var(--w);padding:4px 14px;box-shadow:var(--sh);margin-bottom:15px;align-items:center;border:1px solid var(--bd)}
.search-box input{flex:1;min-width:0;border:none;outline:none;padding:10px;font-size:14px;background:transparent}
.tab-content{display:none;animation:fi .3s ease}.tab-content.active{display:block}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.deposit-card{background:var(--w);padding:18px;box-shadow:var(--sh);margin-bottom:14px;border-left:4px solid var(--amber)}
.deposit-card.approved{border-left-color:var(--g)}.deposit-card.rejected{border-left-color:var(--red)}
.dp-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px;border-bottom:1px dashed var(--bd);padding-bottom:10px}
.dp-user{min-width:0}
.dp-user h4{font-size:15px;font-weight:800;overflow-wrap:anywhere}
.dp-user p{font-size:12px;color:var(--mu);margin-top:3px}
.dp-amount{font-family:'DM Mono',monospace;font-size:18px;font-weight:800;color:var(--g);text-align:right}
.dp-currency{font-size:11px;color:var(--mu);text-align:right;text-transform:uppercase;font-weight:700}
.dp-details{font-size:13px;margin-bottom:14px;line-height:1.8;background:var(--bg);padding:10px}
.dp-details span{color:var(--mu);font-weight:600}
.dp-details strong{font-family:'DM Mono',monospace;word-break:break-all;font-size:12px}
.status-text{font-size:11px;font-weight:800;text-transform:uppercase;padding:4px 10px;display:inline-block}
.status-pending{background:#fef3c7;color:#d97706}.status-approved{background:#ecfdf5;color:var(--g)}.status-rejected{background:#fef2f2;color:var(--red)}
.dp-actions{display:flex;gap:8px}
.dp-actions button{flex:1;padding:11px 4px;font-weight:700;font-size:13px;cursor:pointer;border:none}
.btn-view{background:var(--bg);color:var(--tx);border:1px solid var(--bd)!important}
.btn-approve{background:var(--g);color:#fff}.btn-approve:active{background:var(--gd)}
.btn-reject{background:var(--red);color:#fff}
.loader{display:flex;justify-content:center;text-align:center;padding:20px;color:var(--mu);font-size:13px}

.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:var(--w);display:flex;justify-content:space-around;padding:10px 0 15px;box-shadow:0 -2px 15px rgba(0,0,0,.05);border-top:1px solid var(--bd);z-index:1000}
.nav-item{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--mu);font-size:10px;font-weight:700}
.nav-item.active{color:var(--g)}
.nav-item svg{width:20px;height:20px;margin-bottom:4px}

/* SweetAlert: standard popups, square and phone-sized */
.swal2-container{z-index:99999!important}
.swal2-popup{border-radius:0!important;max-width:calc(100vw - 24px)!important;font-family:'Manrope',sans-serif!important}
.swal2-popup:not(.swal-custom){width:320px!important;padding:20px 16px 16px!important}
.swal2-popup:not(.swal-custom) .swal2-title{font-size:19px;font-weight:800}
.swal2-popup:not(.swal-custom) .swal2-html-container{font-size:14px;line-height:1.7;margin:8px 0 0}
.swal2-popup.receipt-modal{width:min(440px,calc(100vw - 24px))!important}
.receipt-modal img{width:100%;max-height:68vh;object-fit:contain;background:#f3f4f6;display:block}
.swal2-styled{border-radius:0!important;font-size:14px!important;font-weight:700!important}
.swal2-input{border-radius:0!important;width:100%!important;margin:12px 0 0!important;font-size:14px!important;height:44px!important}
.swal2-validation-message{border-radius:0!important;font-size:12px!important}
.swal2-close{box-shadow:none!important}
.swal2-container.swal2-top-start{top:10px!important;left:10px!important;right:auto!important;bottom:auto!important;padding:0!important;width:auto!important;max-width:calc(100vw - 20px)!important}
.swal2-popup.swal-custom{width:auto!important;max-width:min(300px,calc(100vw - 20px))!important;padding:8px 12px!important;margin:0!important;border-left:4px solid var(--g)!important;box-shadow:0 4px 12px rgba(0,0,0,.15)!important;display:flex!important;align-items:center!important;grid-template-columns:none!important}
.swal-custom.swal2-icon-error{border-left-color:var(--red)!important}
.swal-custom .swal2-title{font-size:13px!important;line-height:1.3!important;font-weight:700!important;margin:0!important;padding:0!important;text-align:left!important}
.swal-custom .swal2-icon{margin:0 10px 0 0!important;width:22px!important;min-width:22px!important;height:22px!important;border-width:2px!important;transform:scale(.85)}
.swal-custom .swal2-timer-progress-bar{background:var(--g)!important}
</style>
</head>
<body>

<header class="top-header">
  <a href="admin.html" class="back-btn"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg></a>
  <h1>Deposit Approvals</h1>
</header>

<section class="tabs-container">
  <div class="tabs-header">
    <button class="tab-btn active" id="tabPending" onclick="switchTab('pending',this)">Pending <span class="cnt" id="pendCnt">0</span></button>
    <button class="tab-btn" id="tabHistory" onclick="switchTab('history',this)">History</button>
  </div>
  <div class="search-box">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="#6b7280"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    <input type="text" id="searchInput" placeholder="Search by phone number..." oninput="onSearch()">
  </div>
  <div id="pending" class="tab-content active"><div id="pendingContainer"><div class="loader">Loading pending deposits...</div></div></div>
  <div id="history" class="tab-content"><div id="historyContainer"><div class="loader">Loading history...</div></div></div>
</section>

<nav class="bottom-nav">
  <a href="admin.html" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Dash</a>
  <a href="admin-deposits.html" class="nav-item active"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>Deps</a>
  <a href="admin-withdrawals.html" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>Wds</a>
  <a href="admin-users.html" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>Users</a>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, limit, getDocs, onSnapshot, runTransaction, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCuedBfRowmtHYUuzAB4a9RuOmaON5M0VE",
  authDomain: "quilox-59463.firebaseapp.com",
  projectId: "quilox-59463",
  storageBucket: "quilox-59463.firebasestorage.app",
  messagingSenderId: "602079101577",
  appId: "1:602079101577:web:f4044eca59b7ed8d38fc58"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const fmt = (n, c) => (c === 'NGN' ? '₦' : '$') + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ms = d => d.createdAt?.toMillis?.() || 0;

const Toast = Swal.mixin({ toast: true, position: 'top-start', showConfirmButton: false, timer: 3500, timerProgressBar: true, width: 'auto', customClass: { popup: 'swal-custom' } });

let adminUid = null, pending = [], history = [], historyLoaded = false, term = '', tab = 'pending';
const byId = new Map();   // id -> deposit (keeps big receipt strings out of the HTML)

onAuthStateChanged(auth, async user => {
  if (!user) return (window.location.href = 'admin-login.html');
  try {
    const s = await getDoc(doc(db, 'users', user.uid));
    if (!(s.exists() && s.data().role === 'admin')) return (window.location.href = 'admin-login.html');
    adminUid = user.uid;
    // Pending deposits update live; history is loaded only when that tab is opened
    onSnapshot(query(collection(db, 'deposits'), where('status', '==', 'pending')), snap => {
      pending = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => ms(b) - ms(a));
      pending.forEach(d => byId.set(d.id, d));
      const c = $('pendCnt'); c.innerText = pending.length; c.style.display = pending.length ? 'flex' : 'none';
      renderPending();
    }, e => { console.error(e); $('pendingContainer').innerHTML = '<div class="loader">Could not load deposits. Check your rules.</div>'; });
  } catch (e) { console.error(e); Toast.fire({ icon: 'error', title: 'Could not verify admin access' }); }
});

window.switchTab = (id, btn) => {
  tab = id;
  document.querySelectorAll('.tab-content,.tab-btn').forEach(e => e.classList.remove('active'));
  $(id).classList.add('active'); btn.classList.add('active');
  if (id === 'history' && !historyLoaded) loadHistory();
};
window.onSearch = () => { term = $('searchInput').value.trim().toLowerCase(); renderPending(); renderHistory(); };

async function loadHistory() {
  $('historyContainer').innerHTML = '<div class="loader">Loading history...</div>';
  try {
    const s = await getDocs(query(collection(db, 'deposits'), where('status', 'in', ['approved', 'rejected'])));
    history = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => ms(b) - ms(a));
    history.forEach(d => byId.set(d.id, d));
    historyLoaded = true; renderHistory();
  } catch (e) { console.error(e); $('historyContainer').innerHTML = '<div class="loader">Could not load history. Check your rules.</div>'; }
}

const match = d => !term || String(d.phone || '').toLowerCase().includes(term);
function renderPending() {
  const list = pending.filter(match);
  $('pendingContainer').innerHTML = list.length ? list.map(d => card(d, true)).join('') : '<div class="loader">No pending deposits.</div>';
}
function renderHistory() {
  if (!historyLoaded) return;
  const list = history.filter(match);
  $('historyContainer').innerHTML = list.length ? list.map(d => card(d, false)).join('') : '<div class="loader">No deposit history.</div>';
}

function card(d, isPending) {
  const st = d.status === 'approved' ? ['approved', 'Approved'] : d.status === 'rejected' ? ['rejected', 'Rejected'] : ['pending', 'Pending'];
  const p = d.paymentProof || {};
  const proof = d.currency === 'USD'
    ? `<div><span>Sender Address:</span> <strong>${esc(p.senderAddress || 'N/A')}</strong></div><div><span>TX Hash:</span> <strong>${esc(p.txHash || 'N/A')}</strong></div>`
    : `<div><span>Sender Name:</span> <strong>${esc(p.senderName || 'N/A')}</strong></div>`;
  const reason = d.status === 'rejected' ? `<div><span>Reason:</span> <strong>${esc(d.rejectReason || 'No reason provided')}</strong></div>` : '';
  return `<div class="deposit-card ${st[0] === 'pending' ? '' : st[0]}">
    <div class="dp-header">
      <div class="dp-user"><h4>${esc(d.phone)}</h4><p>${d.createdAt?.toDate ? d.createdAt.toDate().toLocaleString() : 'N/A'}</p></div>
      <div><div class="dp-amount">${fmt(d.amount, d.currency)}</div><div class="dp-currency">${esc(d.currency)}</div></div>
    </div>
    <div class="dp-details">${proof}${reason}<div style="margin-top:10px"><span class="status-text status-${st[0]}">${st[1]}</span></div></div>
    <div class="dp-actions">
      <button class="btn-view" data-act="view" data-id="${esc(d.id)}">View Receipt</button>
      ${isPending ? `<button class="btn-approve" data-act="approve" data-id="${esc(d.id)}">Approve</button><button class="btn-reject" data-act="reject" data-id="${esc(d.id)}">Reject</button>` : ''}
    </div></div>`;
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  ({ view: viewReceipt, approve: approveDeposit, reject: rejectDeposit })[b.dataset.act]?.(b.dataset.id);
});

function viewReceipt(id) {
  const img = byId.get(id)?.receiptBase64;
  if (!img) return Toast.fire({ icon: 'error', title: 'No receipt uploaded' });
  if (!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(img)) return Toast.fire({ icon: 'error', title: 'Receipt image is invalid' });
  Swal.fire({
    title: 'Payment Receipt', html: '<div id="rcpt"></div>', showCloseButton: true, confirmButtonText: 'Close', confirmButtonColor: '#1eb852',
    customClass: { popup: 'receipt-modal' }, scrollbarPadding: false,
    didOpen: () => { const el = new Image(); el.alt = 'Receipt'; el.src = img; $('rcpt').appendChild(el); }
  });
}

async function approveDeposit(id) {
  const d = byId.get(id);
  if (!d) return;
  // Warn if this crypto transaction hash was already used in an approved deposit
  let dup = '';
  const hash = d.paymentProof?.txHash;
  if (d.currency === 'USD' && hash) {
    try {
      const s = await getDocs(query(collection(db, 'deposits'), where('paymentProof.txHash', '==', hash), where('status', '==', 'approved'), limit(1)));
      if (!s.empty) dup = '<br><b style="color:#ef4444">⚠️ This TX hash was already used in an approved deposit!</b>';
    } catch (e) { console.warn('Duplicate check skipped', e); }
  }
  const wallet = d.currency === 'USD' ? 'depositUSD' : 'depositNGN';
  const res = await Swal.fire({
    icon: dup ? 'warning' : 'question', title: 'Approve Deposit?',
    html: `This will credit <b>${esc(d.phone)}</b>'s ${esc(d.currency)} deposit wallet with <b>${fmt(d.amount, d.currency)}</b>.${dup}`,
    showCloseButton: true, showCancelButton: true, confirmButtonText: 'Yes, Approve', cancelButtonText: 'Cancel',
    confirmButtonColor: '#1eb852', cancelButtonColor: '#6b7280', reverseButtons: true,
    showLoaderOnConfirm: true, allowOutsideClick: () => !Swal.isLoading(),
    preConfirm: async () => {
      try {
        // One atomic step: re-check it is still pending, mark approved, credit the wallet
        await runTransaction(db, async tx => {
          const dRef = doc(db, 'deposits', id), s = await tx.get(dRef);
          if (!s.exists() || s.data().status !== 'pending') throw new Error('DONE');
          const x = s.data(), amount = Number(x.amount), uRef = doc(db, 'users', x.userId);
          if (!(amount > 0)) throw new Error('BAD');
          if (!(await tx.get(uRef)).exists()) throw new Error('NOUSER');
          tx.update(dRef, { status: 'approved', approvedAt: serverTimestamp(), approvedBy: adminUid });
          tx.update(uRef, { [x.currency === 'USD' ? 'depositUSD' : 'depositNGN']: increment(amount) });
        });
        return true;
      } catch (e) {
        console.error(e);
        Swal.showValidationMessage(e.message === 'DONE' ? 'This deposit was already processed.' : e.message === 'NOUSER' ? 'This user no longer exists.' : e.message === 'BAD' ? 'Invalid deposit amount.' : 'Failed to approve deposit. Check your rules.');
        return false;
      }
    }
  });
  if (res.isConfirmed) { historyLoaded = false; if (tab === 'history') loadHistory(); Toast.fire({ icon: 'success', title: 'Deposit approved & credited!' }); }
}

async function rejectDeposit(id) {
  const d = byId.get(id);
  if (!d) return;
  const res = await Swal.fire({
    icon: 'warning', title: 'Reject Deposit', html: `Reject the ${fmt(d.amount, d.currency)} deposit from <b>${esc(d.phone)}</b>?`,
    input: 'text', inputPlaceholder: 'Reason for rejection (optional)',
    showCloseButton: true, showCancelButton: true, confirmButtonText: 'Reject', cancelButtonText: 'Cancel',
    confirmButtonColor: '#ef4444', cancelButtonColor: '#6b7280', reverseButtons: true,
    showLoaderOnConfirm: true, allowOutsideClick: () => !Swal.isLoading(),
    preConfirm: async reason => {
      try {
        await runTransaction(db, async tx => {
          const dRef = doc(db, 'deposits', id), s = await tx.get(dRef);
          if (!s.exists() || s.data().status !== 'pending') throw new Error('DONE');
          tx.update(dRef, { status: 'rejected', rejectReason: (reason || '').trim() || 'No reason provided', rejectedAt: serverTimestamp(), rejectedBy: adminUid });
        });
        return true;
      } catch (e) {
        console.error(e);
        Swal.showValidationMessage(e.message === 'DONE' ? 'This deposit was already processed.' : 'Failed to reject deposit. Check your rules.');
        return false;
      }
    }
  });
  if (res.isConfirmed) { historyLoaded = false; if (tab === 'history') loadHistory(); Toast.fire({ icon: 'success', title: 'Deposit rejected' }); }
}
</script>
</body>
</html>
