<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quilox - Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root{--g:#1eb852;--gd:#159b42;--tx:#1a1a1a;--mu:#6b7280;--bd:#e5e7eb;--bg:#f8f9fb;--w:#fff;--sh:0 4px 15px rgba(0,0,0,.05);--red:#ef4444;--amber:#f59e0b}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Manrope',sans-serif}
body{background:var(--bg);color:var(--tx);padding-bottom:90px}
.mono,.wallet-balance,.plan-detail-value,.inv-detail strong{font-family:'DM Mono',monospace}

/* Header */
.top-header{background:var(--g);padding:20px;border-radius:0 0 20px 20px;color:#fff;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 10px rgba(30,184,82,.2)}
.user-info h2{font-size:16px;font-weight:700;margin-bottom:4px}
.user-info p{font-size:12px;font-family:'DM Mono',monospace;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:4px;display:inline-block}
.logout-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}

/* Wallets */
.action-container{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:-10px}
.wallet-card{background:var(--w);padding:14px;border-radius:14px;box-shadow:var(--sh);border-top:4px solid #2563eb;min-width:0}
.wallet-card.ngn{border-top-color:var(--g)}
.wallet-title{font-size:11px;color:var(--mu);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.wallet-balance-row{display:flex;flex-direction:column;margin-bottom:8px}
.wallet-label{font-size:10px;color:var(--mu);font-weight:600}
.wallet-balance{font-size:15px;font-weight:800;overflow-wrap:anywhere}
.wallet-actions{display:flex;gap:6px;margin-top:12px}
.btn-deposit,.btn-withdraw{flex:1;padding:9px 4px;border:none;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer}
.btn-deposit{background:var(--g);color:#fff}
.btn-withdraw{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}

/* Tabs */
.tabs-container{padding:0 20px}
.tabs-header{display:flex;background:var(--w);border-radius:12px;padding:5px;box-shadow:var(--sh);margin-bottom:20px}
.tab-btn{flex:1;padding:10px 4px;font-size:12px;font-weight:700;color:var(--mu);background:transparent;border:none;border-radius:9px;cursor:pointer;transition:.3s}
.tab-btn.active{background:var(--g);color:#fff;box-shadow:0 2px 8px rgba(30,184,82,.3)}
.tab-content{display:none;animation:fi .3s ease}.tab-content.active{display:block}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* Plans */
.plans-grid{display:grid;gap:14px}
.plan-card{background:var(--w);border-radius:14px;padding:18px;box-shadow:var(--sh);border:1px solid var(--bd)}
.plan-name{font-size:17px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.plan-name small{font-size:10px;font-weight:800;background:#ecfdf5;color:var(--g);padding:3px 8px;border-radius:20px}
.plan-details{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;background:var(--bg);padding:12px;border-radius:10px}
.plan-detail-label{font-size:10px;color:var(--mu);font-weight:700;text-transform:uppercase}
.plan-detail-value{font-size:14px;font-weight:800;color:var(--g);margin-top:2px}
.btn-buy{width:100%;padding:13px;background:var(--g);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;transition:.2s}
.btn-buy:active{background:var(--gd);transform:scale(.98)}

/* Investments */
.investment-card{background:var(--w);border-radius:14px;padding:15px;box-shadow:var(--sh);margin-bottom:14px;border-left:4px solid var(--g)}
.investment-card.done{border-left-color:var(--mu)}
.inv-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px dashed var(--bd);padding-bottom:10px}
.inv-title{font-weight:800;font-size:15px}
.inv-status{font-size:11px;font-weight:700;background:#ecfdf5;color:var(--g);padding:3px 10px;border-radius:10px}
.done .inv-status{background:#f3f4f6;color:var(--mu)}
.inv-details{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inv-detail span{display:block;color:var(--mu);font-size:10px;text-transform:uppercase;font-weight:700}
.inv-detail strong{font-size:13px}
.bar{height:6px;background:var(--bd);border-radius:6px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:6px}
.loader{display:flex;justify-content:center;padding:30px;color:var(--mu);font-size:14px}

/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:var(--w);display:flex;justify-content:space-around;padding:10px 0 15px;box-shadow:0 -2px 15px rgba(0,0,0,.05);border-top:1px solid var(--bd);z-index:1000}
.nav-item{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--mu);font-size:11px;font-weight:700}
.nav-item.active{color:var(--g)}
.nav-item svg{width:22px;height:22px;margin-bottom:4px}

/* ===== Modals (confirm / insufficient / success) ===== */
.swal2-container{z-index:99999!important}
.swal2-popup.q-popup{width:min(340px,calc(100vw - 32px))!important;padding:26px 20px 18px!important;border-radius:22px!important;box-shadow:0 20px 50px rgba(0,0,0,.2)!important}
.q-popup .swal2-html-container{margin:0!important;padding:0!important;overflow:visible!important}
.q-ico{width:54px;height:54px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
.q-ico.ok{background:#ecfdf5;color:var(--g)}.q-ico.warn{background:#fef2f2;color:var(--red)}
.q-ico.ask{background:#eff6ff;color:#2563eb}.q-ico.info{background:#fffbeb;color:var(--amber)}
.q-title{font-size:18px;font-weight:800;margin-bottom:6px}
.q-text{font-size:13px;color:var(--mu);line-height:1.5;margin-bottom:4px}
.q-rows{margin-top:14px;background:var(--bg);border-radius:12px;padding:4px 14px;text-align:left}
.q-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:13px}
.q-row:last-child{border-bottom:none}
.q-row span{color:var(--mu);font-weight:600}
.q-row b{font-family:'DM Mono',monospace;font-weight:700;text-align:right}
.q-row.hl span,.q-row.hl b{color:var(--red);font-weight:800}
.q-popup .swal2-actions{width:100%;margin:16px 0 0!important;gap:10px;flex-wrap:nowrap}
.q-btn{flex:1;padding:13px 10px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer}
.q-primary{background:var(--g);color:#fff}
.q-ghost{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.q-popup .swal2-close{color:var(--mu);font-size:30px;top:6px;right:8px;box-shadow:none!important}
.q-popup .swal2-validation-message{font-size:12px;margin:12px 0 0;border-radius:10px}
.q-popup .swal2-loader{border-color:#fff transparent}

/* ===== Small toast (top-left) ===== */
.swal2-container.swal2-top-start{top:10px!important;left:10px!important;right:auto!important;bottom:auto!important;padding:0!important;width:auto!important;max-width:calc(100vw - 20px)!important}
.swal2-popup.swal-custom{width:auto!important;max-width:min(300px,calc(100vw - 20px))!important;padding:8px 12px!important;margin:0!important;border-radius:8px!important;border-left:4px solid var(--g)!important;box-shadow:0 4px 12px rgba(0,0,0,.15)!important;display:flex!important;align-items:center!important;grid-template-columns:none!important}
.swal-custom.swal2-icon-error{border-left-color:var(--red)!important}
.swal-custom .swal2-title{font-size:13px!important;line-height:1.3!important;font-weight:700!important;margin:0!important;padding:0!important;text-align:left!important}
.swal-custom .swal2-icon{margin:0 10px 0 0!important;width:22px!important;min-width:22px!important;height:22px!important;border-width:2px!important;transform:scale(.85)}
.swal-custom .swal2-timer-progress-bar{background:var(--g)!important}
</style>
</head>
<body>

<header class="top-header">
  <div class="user-info"><h2 id="userPhone">Loading...</h2><p id="userRefCode">REF: ...</p></div>
  <button class="logout-btn" id="logoutBtn">Logout</button>
</header>

<section class="action-container">
  <div class="wallet-card usd">
    <div class="wallet-title">USD Wallet</div>
    <div class="wallet-balance-row"><span class="wallet-label">Deposit</span><span class="wallet-balance" id="usdDeposit">$0.00</span></div>
    <div class="wallet-balance-row"><span class="wallet-label">Withdraw</span><span class="wallet-balance" id="usdWithdraw">$0.00</span></div>
    <div class="wallet-actions"><button class="btn-deposit" onclick="openDeposit('USD')">Deposit</button><button class="btn-withdraw" onclick="openWithdraw('USD')">Withdraw</button></div>
  </div>
  <div class="wallet-card ngn">
    <div class="wallet-title">NGN Wallet</div>
    <div class="wallet-balance-row"><span class="wallet-label">Deposit</span><span class="wallet-balance" id="ngnDeposit">₦0.00</span></div>
    <div class="wallet-balance-row"><span class="wallet-label">Withdraw</span><span class="wallet-balance" id="ngnWithdraw">₦0.00</span></div>
    <div class="wallet-actions"><button class="btn-deposit" onclick="openDeposit('NGN')">Deposit</button><button class="btn-withdraw" onclick="openWithdraw('NGN')">Withdraw</button></div>
  </div>
</section>

<section class="tabs-container">
  <div class="tabs-header">
    <button class="tab-btn active" onclick="switchTab('usd-plans',this)">USD Plans</button>
    <button class="tab-btn" onclick="switchTab('ngn-plans',this)">NGN Plans</button>
    <button class="tab-btn" onclick="switchTab('my-investments',this)">My Investments</button>
  </div>
  <div id="usd-plans" class="tab-content active"><div class="plans-grid" id="usdPlansContainer"><div class="loader">Loading plans...</div></div></div>
  <div id="ngn-plans" class="tab-content"><div class="plans-grid" id="ngnPlansContainer"><div class="loader">Loading plans...</div></div></div>
  <div id="my-investments" class="tab-content"><div id="myInvestmentsContainer"><div class="loader">Loading your investments...</div></div></div>
</section>

<nav class="bottom-nav">
  <a href="dashboard.html" class="nav-item active"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Home</a>
  <a href="referral.html" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>Referral</a>
  <a href="profile.html" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>Profile</a>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, collection, query, where, getDocs, updateDoc, serverTimestamp, increment, runTransaction, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCuedBfRowmtHYUuzAB4a9RuOmaON5M0VE",
  authDomain: "quilox-59463.firebaseapp.com",
  projectId: "quilox-59463",
  storageBucket: "quilox-59463.firebasestorage.app",
  messagingSenderId: "602079101577",
  appId: "1:602079101577:web:f4044eca59b7ed8d38fc58"
});
const auth = getAuth(app), db = getFirestore(app);

const RATE = 1500, DURATION = 25, DAY = 86400000;
const REF_LEVELS = [['referredBy', .10], ['referredByL2', .03], ['referredByL3', .01]];
const MIN_WITHDRAW = { USD: 1, NGN: 1500 };
const PLANS = [
  { name: 'Quilox 1', price: 5, roi: 1 }, { name: 'Quilox 2', price: 10, roi: 2 },
  { name: 'Quilox 3', price: 20, roi: 4 }, { name: 'Quilox 4', price: 50, roi: 10 },
  { name: 'Quilox 5', price: 100, roi: 20 }, { name: 'Quilox 6', price: 200, roi: 40 }
];
let me = null, busy = false;

const r2 = n => Math.round(n * 100) / 100;
const fmt = (n, c) => (c === 'NGN' ? '₦' : '$') + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const $ = id => document.getElementById(id);

/* ---------- Toast (small, brief notices) ---------- */
const Toast = Swal.mixin({ toast: true, position: 'top-start', showConfirmButton: false, timer: 3500, timerProgressBar: true, width: 'auto', customClass: { popup: 'swal-custom' } });

/* ---------- Modal helper (confirm / insufficient / success / info) ---------- */
const ICONS = { ok: '✓', warn: '!', ask: '?', info: 'i' };
function modal({ tone = 'ok', title, text = '', rows = [], confirm = 'Done', cancel = '', extra = {} }) {
  const rowsHtml = rows.length ? `<div class="q-rows">${rows.map(([l, v, hl]) => `<div class="q-row${hl ? ' hl' : ''}"><span>${l}</span><b>${v}</b></div>`).join('')}</div>` : '';
  return Swal.fire({
    html: `<div class="q-ico ${tone}">${ICONS[tone]}</div><h3 class="q-title">${title}</h3>${text ? `<p class="q-text">${text}</p>` : ''}${rowsHtml}`,
    showCloseButton: true, showCancelButton: !!cancel, confirmButtonText: confirm, cancelButtonText: cancel || 'Close',
    reverseButtons: true, buttonsStyling: false, focusConfirm: false,
    customClass: { popup: 'q-popup', actions: 'swal2-actions', confirmButton: 'q-btn q-primary', cancelButton: 'q-btn q-ghost' },
    ...extra
  });
}

/* ---------- Auth ---------- */
onAuthStateChanged(auth, async user => {
  if (!user) return (window.location.href = 'login.html');
  me = user;
  await loadUserData();
  renderPlans();
  loadInvestments();
});
$('logoutBtn').onclick = () => signOut(auth).then(() => (window.location.href = 'login.html'));

window.switchTab = (id, btn) => {
  document.querySelectorAll('.tab-content,.tab-btn').forEach(e => e.classList.remove('active'));
  $(id).classList.add('active'); btn.classList.add('active');
};

/* ---------- Wallets ----------
   Signup (register page) still writes depositBalance / withdrawalBalance (USD value).
   This moves anything in those legacy fields into the USD/NGN wallets, atomically. */
async function syncWallets() {
  const ref = doc(db, 'users', me.uid);
  return runTransaction(db, async tx => {
    const snap = await tx.get(ref);
    if (!snap.exists()) return null;
    const d = snap.data();
    const ld = Number(d.depositBalance || 0), lw = Number(d.withdrawalBalance || 0);
    if (ld > 0 || lw > 0) {
      const cur = d.currency === 'NGN' ? 'NGN' : 'USD', k = cur === 'NGN' ? RATE : 1;
      const dep = r2(ld * k), wd = r2(lw * k);
      tx.update(ref, { [`deposit${cur}`]: increment(dep), [`withdrawal${cur}`]: increment(wd), depositBalance: 0, withdrawalBalance: 0 });
      d[`deposit${cur}`] = (d[`deposit${cur}`] || 0) + dep;
      d[`withdrawal${cur}`] = (d[`withdrawal${cur}`] || 0) + wd;
    }
    return d;
  });
}

async function loadUserData() {
  try {
    const d = await syncWallets();
    if (!d) return;
    $('userPhone').innerText = d.phone;
    $('userRefCode').innerText = `REF: ${d.referralCode}`;
    $('usdDeposit').innerText = fmt(d.depositUSD, 'USD');
    $('usdWithdraw').innerText = fmt(d.withdrawalUSD, 'USD');
    $('ngnDeposit').innerText = fmt(d.depositNGN, 'NGN');
    $('ngnWithdraw').innerText = fmt(d.withdrawalNGN, 'NGN');
    return d;
  } catch (e) { console.error(e); Toast.fire({ icon: 'error', title: 'Could not load wallet' }); }
}

/* ---------- Plans ---------- */
function planCard(p, cur) {
  const k = cur === 'NGN' ? RATE : 1, price = p.price * k, roi = p.roi * k;
  const items = [['Price', fmt(price, cur)], ['Daily ROI', fmt(roi, cur)], ['Total Return', fmt(roi * DURATION, cur)], ['Duration', `${DURATION} Days`]];
  return `<div class="plan-card"><div class="plan-name">${p.name}<small>${cur}</small></div>
    <div class="plan-details">${items.map(([l, v]) => `<div><div class="plan-detail-label">${l}</div><div class="plan-detail-value">${v}</div></div>`).join('')}</div>
    <button class="btn-buy" onclick="buyPlan('${p.name}',${price},${roi},'${cur}')">Invest ${fmt(price, cur)}</button></div>`;
}
function renderPlans() {
  $('usdPlansContainer').innerHTML = PLANS.map(p => planCard(p, 'USD')).join('');
  $('ngnPlansContainer').innerHTML = PLANS.map(p => planCard(p, 'NGN')).join('');
}

/* ---------- Buy plan ---------- */
window.buyPlan = async (planName, price, roi, cur) => {
  if (!me || busy) return;
  busy = true;
  try {
    const d = await syncWallets();
    const bal = Number(d?.[`deposit${cur}`] || 0);

    // Insufficient balance: show exactly how much more is needed
    if (bal + 1e-9 < price) {
      const res = await modal({
        tone: 'warn', title: 'Insufficient balance',
        text: `Top up your ${cur} deposit wallet to invest in ${planName}.`,
        rows: [['Plan price', fmt(price, cur)], ['Your balance', fmt(bal, cur)], ['You need', fmt(price - bal, cur) + ' more', true]],
        confirm: `Deposit ${cur}`, cancel: 'Close'
      });
      if (res.isConfirmed) window.openDeposit(cur);
      return;
    }

    // Confirm, then run the purchase with a loader on the button
    const res = await modal({
      tone: 'ask', title: 'Confirm investment', text: `You are about to invest in ${planName}.`,
      rows: [['Amount', fmt(price, cur)], ['Daily ROI', fmt(roi, cur)], ['Total return', fmt(roi * DURATION, cur)], ['Balance after', fmt(bal - price, cur)]],
      confirm: 'Invest now', cancel: 'Cancel',
      extra: {
        showLoaderOnConfirm: true, allowOutsideClick: () => !Swal.isLoading(),
        preConfirm: async () => {
          try { return await executePurchase(planName, price, roi, cur); }
          catch (e) {
            console.error(e);
            Swal.showValidationMessage(e.message === 'INSUFFICIENT' ? 'Your balance is no longer enough for this plan.' : 'Investment failed. Please try again.');
            return false;
          }
        }
      }
    });
    if (!res.isConfirmed) return;

    loadUserData(); loadInvestments();
    const done = await modal({
      tone: 'ok', title: 'Investment active', text: `${planName} has started earning for you.`,
      rows: [['Invested', fmt(price, cur)], ['Daily ROI', fmt(roi, cur)]],
      confirm: 'View investments', cancel: 'Close'
    });
    if (done.isConfirmed) switchTab('my-investments', document.querySelectorAll('.tab-btn')[2]);
  } finally { busy = false; }
};

// One atomic transaction: check balance, deduct, create investment, flag first purchase.
async function executePurchase(planName, price, roi, cur) {
  const userRef = doc(db, 'users', me.uid);
  const invRef = doc(collection(db, 'investments'));
  const u = await runTransaction(db, async tx => {
    const snap = await tx.get(userRef);
    const d = snap.data();
    if (Number(d[`deposit${cur}`] || 0) + 1e-9 < price) throw new Error('INSUFFICIENT');
    tx.update(userRef, { [`deposit${cur}`]: increment(-price), hasInvested: true });
    tx.set(invRef, {
      userId: me.uid, planName, amount: price, dailyROI: roi, currency: cur,
      startDate: serverTimestamp(), endDate: Timestamp.fromMillis(Date.now() + DURATION * DAY),
      lastPayout: serverTimestamp(), daysPaid: 0, status: 'active'
    });
    return { first: !d.hasInvested, d };
  });
  if (u.first) await processReferral(u.d, price, cur); // never fails the purchase
  return true;
}

/* ---------- Referral: 10% / 3% / 1% on the referred user's FIRST purchase ---------- */
async function processReferral(d, amount, cur) {
  const jobs = REF_LEVELS
    .map(([key, pct]) => ({ id: d[key], bonus: r2(amount * pct) }))
    .filter(l => l.id && l.id !== me.uid && l.bonus > 0)
    .map(l => updateDoc(doc(db, 'users', l.id), { [`withdrawal${cur}`]: increment(l.bonus) }));
  const results = await Promise.allSettled(jobs);
  results.forEach(r => r.status === 'rejected' && console.error('Referral credit failed:', r.reason));
}

/* ---------- Investments + daily ROI (atomic, can't double-credit) ---------- */
async function creditROI(invId) {
  const invRef = doc(db, 'investments', invId);
  try {
    return await runTransaction(db, async tx => {
      const s = await tx.get(invRef);
      if (!s.exists()) return null;
      const inv = s.data();
      if (inv.status !== 'active' || !inv.lastPayout?.toMillis) return null;
      const last = inv.lastPayout.toMillis(), paid = inv.daysPaid || 0;
      const pay = Math.min(Math.floor((Date.now() - last) / DAY), DURATION - paid);
      if (pay <= 0) return null;
      const total = r2(inv.dailyROI * pay);
      tx.update(doc(db, 'users', inv.userId), { [`withdrawal${inv.currency}`]: increment(total) });
      tx.update(invRef, { daysPaid: paid + pay, lastPayout: Timestamp.fromMillis(last + pay * DAY), status: paid + pay >= DURATION ? 'completed' : 'active' });
      return { total, cur: inv.currency };
    });
  } catch (e) { console.error('ROI credit failed:', e); return null; }
}

async function loadInvestments() {
  const box = $('myInvestmentsContainer');
  const q = query(collection(db, 'investments'), where('userId', '==', me.uid));
  let snap = await getDocs(q);
  const credits = (await Promise.all(snap.docs.filter(x => x.data().status === 'active').map(x => creditROI(x.id)))).filter(Boolean);
  if (credits.length) {
    snap = await getDocs(q);
    loadUserData();
    const sums = {}; credits.forEach(c => (sums[c.cur] = (sums[c.cur] || 0) + c.total));
    Toast.fire({ icon: 'success', title: 'ROI credited: ' + Object.entries(sums).map(([c, t]) => fmt(t, c)).join(' + ') });
  }
  if (snap.empty) return (box.innerHTML = '<div class="loader">No investments yet.</div>');

  const ms = x => x.data().startDate?.toMillis?.() || Date.now();
  box.innerHTML = snap.docs.sort((a, b) => ms(b) - ms(a)).map(x => {
    const v = x.data(), paid = v.daysPaid || 0, done = v.status !== 'active';
    return `<div class="investment-card${done ? ' done' : ''}">
      <div class="inv-header"><div class="inv-title">${v.planName} (${v.currency})</div><div class="inv-status">${done ? 'Completed' : 'Active'}</div></div>
      <div class="inv-details">
        <div class="inv-detail"><span>Invested</span><strong>${fmt(v.amount, v.currency)}</strong></div>
        <div class="inv-detail"><span>Daily ROI</span><strong>${fmt(v.dailyROI, v.currency)}</strong></div>
        <div class="inv-detail"><span>Earned so far</span><strong>${fmt(v.dailyROI * paid, v.currency)}</strong></div>
        <div class="inv-detail"><span>Days paid</span><strong>${paid} / ${DURATION}</strong></div>
      </div>
      <div class="bar"><i style="width:${Math.round(paid / DURATION * 100)}%"></i></div></div>`;
  }).join('');
}

/* ---------- Deposit / Withdraw ---------- */
window.openDeposit = cur => modal({ tone: 'info', title: `Deposit ${cur}`, text: `The ${cur} deposit option will be available here soon.` });

window.openWithdraw = async cur => {
  const d = await syncWallets();
  const bal = Number(d?.[`withdrawal${cur}`] || 0), min = MIN_WITHDRAW[cur];
  if (bal + 1e-9 < min) {
    return modal({
      tone: 'warn', title: 'Minimum not reached', text: 'Your withdrawal wallet is below the minimum amount.',
      rows: [['Your balance', fmt(bal, cur)], ['Minimum', fmt(min, cur)], ['You need', fmt(min - bal, cur) + ' more', true]], confirm: 'Close'
    });
  }
  modal({ tone: 'info', title: `Withdraw ${cur}`, text: `The ${cur} withdrawal option will be available here soon.`, rows: [['Available', fmt(bal, cur)]] });
};
</script>
